<!doctype html>
<html lang="mk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090b"><title>CLST Trucking AI — Admin Login</title>
<style>
:root{color-scheme:dark;--red:#e11d2e;--bg:#09090b;--panel:#151519;--muted:#a6a6ad}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0%,#351018 0,transparent 50%),#09090b;color:#fff;font:15px/1.5 Inter,Arial,sans-serif}
.login{width:min(100%,420px);padding:34px 30px;background:linear-gradient(145deg,#1a171b,#101013);border:1px solid #5b2931;border-radius:20px;box-shadow:0 24px 90px #0009}
.logo{width:58px;height:58px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,#ff3446,#a90018);font-size:28px;font-weight:950;box-shadow:0 8px 30px #e11d2e40;margin-bottom:22px}
.kicker{font-size:11px;font-weight:900;letter-spacing:.2em;color:#ff6572}h1{font-size:27px;line-height:1.15;margin:7px 0}p{color:var(--muted);margin:0 0 26px}
label{display:block;font-size:12px;font-weight:800;margin:16px 0 7px;color:#e8e8eb}
input{width:100%;border:1px solid #d8d8dd;border-radius:9px;background:#fff;color:#111;padding:14px 13px;font:inherit;outline:none}
input:focus{border-color:var(--red);box-shadow:0 0 0 3px #e11d2e30}
button{width:100%;margin-top:22px;border:0;border-radius:9px;padding:14px;background:var(--red);color:#fff;font-size:14px;font-weight:900;cursor:pointer}
button:hover{background:#ff3446}button:disabled{opacity:.65;cursor:wait}
#error{min-height:22px;margin-top:14px;color:#ff9ca5;font-size:13px}footer{text-align:center;color:#777;font-size:11px;margin-top:24px}
</style></head>
<body><main class="login"><div class="logo">C</div><div class="kicker">SECURE ADMIN ACCESS</div><h1>CLST Trucking AI</h1><p>Најави се на твојот администраторски профил.</p>
<form id="login"><label for="username">Корисничко име</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Лозинка</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">НАЈАВИ СЕ</button><div id="error" role="alert"></div></form><footer>CLST TRUCKING LLC · PRIVATE ADMIN AREA</footer></main>
<script>
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),err=document.getElementById('error');b.disabled=true;b.textContent='СЕ НАЈАВУВАШ…';err.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Најавувањето не успеа.');location.replace('/index.html');}catch(x){err.textContent=x.message||'Грешка при најава.';}finally{b.disabled=false;b.textContent='НАЈАВИ СЕ';}});
</script></body></html>
