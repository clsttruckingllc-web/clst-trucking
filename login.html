<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0d">
<title>CLST TRUCKING · MARKO AI Login</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#151519;--line:#303039;--text:#f7f7f8;--muted:#a1a1aa;--red:#dc2626;--red2:#991b1b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0%,#451414 0%,#171016 38%,var(--bg) 76%);font:15px/1.5 Inter,Arial,sans-serif;color:var(--text)}
.shell{width:min(100%,440px)}.brand{display:flex;align-items:center;gap:13px;margin:0 0 24px}.mark{width:49px;height:49px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#ef4444,#991b1b);font-size:23px;font-weight:950}.brand-name{font-size:13px;font-weight:900;letter-spacing:.18em}.brand-sub{font-size:12px;color:var(--muted)}
.panel{padding:clamp(23px,6vw,34px);border:1px solid #ffffff18;border-radius:21px;background:#151519ed;box-shadow:0 24px 90px #0008}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.17em;color:#f87171;text-transform:uppercase}h1{font-size:30px;line-height:1.1;margin:9px 0}.intro{margin:0 0 23px;color:var(--muted);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;background:#09090b;border:1px solid var(--line);border-radius:12px;margin-bottom:21px}.tab{border:0;border-radius:8px;padding:10px;background:transparent;color:var(--muted);font:inherit;font-weight:750;cursor:pointer}.tab[aria-selected=true]{background:#3a2020;color:white}
.field{margin:0 0 15px}label{display:block;margin-bottom:7px;font-size:13px;font-weight:750;color:#e4e4e7}input{width:100%;min-height:48px;padding:12px 14px;border:1px solid #3f3f46;border-radius:10px;background:#09090b;color:#fff;font:inherit}input:focus{outline:2px solid #ef4444;outline-offset:1px;border-color:transparent}
.submit{width:100%;min-height:50px;margin-top:5px;border:0;border-radius:11px;background:linear-gradient(100deg,#dc2626,#991b1b);color:white;font:inherit;font-weight:900;cursor:pointer}.submit:disabled{opacity:.65;cursor:wait}
#message{min-height:24px;margin:13px 0 0;color:#fca5a5;font-size:13px}#message.ok{color:#86efac}.foot{margin:16px 0 0;text-align:center;color:#a1a1aa;font-size:11px}.note{margin-top:14px;padding:10px 12px;border:1px solid #713f12;border-radius:9px;background:#42200655;color:#fcd34d;font-size:11px;line-height:1.5}[hidden]{display:none!important}
</style>
</head>
<body><main class="shell">
<header class="brand"><div class="mark">C</div><div><div class="brand-name">CLST TRUCKING</div><div class="brand-sub">MARKO AI · Dispatch intelligence</div></div></header>
<section class="panel">
<div class="eyebrow">CLST operations workspace</div><h1 id="heading">Welcome back.</h1><p class="intro" id="intro">Log in to open the CLST command center.</p>
<form id="authForm">
<div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+" required></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></div>
<button class="submit" id="submitButton" type="submit">Log in</button><div id="message" role="status" aria-live="polite"></div>
</form>
<div class="note">CLST team access. Account creation is reserved for the owner.</div>
</section><p class="foot">CLST TRUCKING · MARKO AI</p>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),STORE='clst_marko_accounts_v1',SESSION='clst_marko_session_v1';
const read=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch{return {}}};
const enc=s=>new TextEncoder().encode(s);
const hex=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');
async function derive(password,salt){const key=await crypto.subtle.importKey('raw',enc(password),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(salt.match(/../g),x=>parseInt(x,16)),iterations:160000,hash:'SHA-256'},key,256))}
if(sessionStorage.getItem(SESSION)==='yes')location.replace('/');
$('authForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('submitButton'),msg=$('message'),username=$('username').value.trim().toLowerCase(),password=$('password').value;btn.disabled=true;btn.textContent='Signing in…';msg.textContent='';
try{const accounts=read();const account=accounts[username];if(!account||await derive(password,account.salt)!==account.hash)throw Error('Incorrect username or password.');msg.className='ok';msg.textContent='Welcome back. Opening CLST…'}sessionStorage.setItem(SESSION,'yes');$('password').value='';$('confirmPassword').value='';location.replace('/')}catch(err){msg.className='';msg.textContent=err.message||'Could not complete sign-in.';btn.disabled=false;btn.textContent='Log in'}});
})();
</script></body></html>
