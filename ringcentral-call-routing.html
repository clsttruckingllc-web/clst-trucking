<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLST Trucking AI — Call Routing</title>
<style>
:root{color-scheme:dark;font:16px/1.55 Arial,sans-serif;background:#0b1220;color:#f3f6fc}
body{max-width:900px;margin:35px auto;padding:0 16px}
.panel{background:#111c2e;border:1px solid #293a53;border-radius:12px;padding:20px;margin:18px 0}
button{background:#428cff;color:white;border:0;border-radius:8px;padding:12px 16px;font-weight:bold;cursor:pointer}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#08101d;padding:16px;border-radius:8px}
small{color:#9aabc2}
</style>
</head>
<body>
<h1>CLST Trucking AI — Call Routing</h1>
<p>This is a read-only inspection of RingCentral company and extension answering rules. It does not change or delete anything.</p>
<div class="panel">
<button id="check">Inspect call-routing rules</button>
<pre id="result">Ready.</pre>
</div>
<p><small>Credentials stay on the server. This page does not display forwarding phone numbers, call audio, or SIP credentials.</small></p>
<script>
document.getElementById("check").addEventListener("click", async () => {
  const out = document.getElementById("result");
  out.textContent = "Checking RingCentral...";
  try {
    const response = await fetch("/api/ringcentral-call-routing", { method: "POST" });
    const data = await response.json();
    out.textContent = JSON.stringify(data, null, 2);
  } catch (error) {
    out.textContent = "Request failed: " + String(error);
  }
});
</script>
</body>
</html>
