<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLST RingCentral Call Control</title><body style="font:16px Arial;max-width:700px;margin:40px auto;padding:16px;background:#0b1220;color:#f3f6fc"><h1>CLST Trucking AI — RingCentral</h1><p>Read-only Call Control diagnostic.</p><button id="check">Check active-call access</button><pre id="result">Ready.</pre><p>This checks call metadata only; it does not access audio or answer calls.</p><script>document.getElementById('check').onclick=async function(){const r=document.getElementById('result');r.textContent='Checking...';try{const x=await fetch('/api/ringcentral-active-calls',{method:'POST'});r.textContent=JSON.stringify(await x.json(),null,2)}catch(e){r.textContent=String(e)}};</script></body></html>
