name: Validate CLST Gmail Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker.js"
      - ".github/workflows/validate-gmail-worker.yml"
  pull_request:
    branches: [main]
    paths:
      - "cloudflare-worker.js"
      - ".github/workflows/validate-gmail-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: node --check cloudflare-worker.js
      - name: Check required auto-reply safeguards and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'confidence<0.92' cloudflare-worker.js
          grep -q 'smart_reply_v1:' cloudflare-worker.js
          grep -q 'Sensitive/commitment-related email requires review' cloudflare-worker.js
          grep -q '/api/autoreply/status' cloudflare-worker.js
