name: Deploy CLST Gmail Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker.js"
      - ".github/workflows/deploy-gmail-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_KV_NAMESPACE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository Actions secret: $name"
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create deployment config
        shell: bash
        env:
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          cat > wrangler.toml <<EOF
          name = "clst-gmail-backend"
          main = "cloudflare-worker.js"
          compatibility_date = "2026-10-24"

          [[kv_namespaces]]
          binding = "TOKENS"
          id = "$CLOUDFLARE_KV_NAMESPACE_ID"

          [triggers]
          crons = []
          EOF

      - name: Validate Worker JavaScript
        run: node --check cloudflare-worker.js

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --keep-vars
