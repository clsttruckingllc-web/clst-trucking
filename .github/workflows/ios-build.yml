name: Build CLST iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - ios-native-wrapper
    paths:
      - "native-ios/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build-ios-device:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iPhone app (unsigned, for local sideload signing)
        working-directory: native-ios
        run: |
          xcodebuild \
            -project CLSTTruckingiOS.xcodeproj \
            -scheme CLSTTruckingiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/CLSTDeviceData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/CLSTPayload/Payload"
          cp -R "$RUNNER_TEMP/CLSTDeviceData/Build/Products/Release-iphoneos/CLSTTruckingiOS.app" "$RUNNER_TEMP/CLSTPayload/Payload/"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/CLSTPayload/Payload" "$GITHUB_WORKSPACE/CLSTTruckingiOS-unsigned.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLSTTruckingiOS-unsigned-IPA
          path: CLSTTruckingiOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
