name: Build CLST iOS (simulator check)

on:
  workflow_dispatch:
  push:
    branches:
      - ios-native-wrapper
    paths:
      - "native-ios/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build-ios-simulator:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS Simulator app
        working-directory: native-ios
        run: |
          xcodebuild \
            -project CLSTTruckingiOS.xcodeproj \
            -scheme CLSTTruckingiOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/CLSTDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator build for inspection
        if: success()
        run: |
          cd "$RUNNER_TEMP/CLSTDerivedData/Build/Products/Release-iphonesimulator"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent CLSTTruckingiOS.app "$GITHUB_WORKSPACE/CLSTTruckingiOS-Simulator.zip"

      - name: Upload simulator build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CLSTTruckingiOS-simulator-only
          path: CLSTTruckingiOS-Simulator.zip
          if-no-files-found: error
          retention-days: 7
