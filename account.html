<!doctype html>
<html lang="mk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>CLST — Account Security</title>
<style>
:root{color-scheme:dark;--red:#e11d2e;--muted:#aaa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#09090b;color:#fff;font:15px/1.5 Inter,Arial,sans-serif;padding:24px;display:grid;place-items:center}.panel{width:min(100%,480px);padding:30px;background:#151519;border:1px solid #5b2931;border-radius:18px}a{color:#ff6572;text-decoration:none;font-weight:800}.eyebrow{color:#ff6572;font-size:11px;font-weight:900;letter-spacing:.18em}h1{margin:8px 0}p{color:var(--muted)}label{display:block;margin:16px 0 7px;font-size:12px;font-weight:800}input{width:100%;padding:13px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#111;font:inherit}button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:8px;background:var(--red);color:#fff;font-weight:900;cursor:pointer}#msg{min-height:24px;margin-top:12px;font-size:13px}.back{display:inline-block;margin-bottom:22px}
</style></head><body><main class="panel"><a class="back" href="/index.html">← Назад кон CLST</a><div class="eyebrow">ADMIN SECURITY</div><h1>Промена на лозинка</h1><p>Користи најмалку 12 знаци. Новата лозинка се чува како криптографски hash.</p>
<form id="change"><label for="current">Тековна лозинка</label><input id="current" type="password" autocomplete="current-password" required><label for="next">Нова лозинка</label><input id="next" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">Потврди нова лозинка</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><button id="save">ЗАЧУВАЈ НОВА ЛОЗИНКА</button><div id="msg" role="status"></div></form></main>
<script>
document.getElementById('change').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg'),b=document.getElementById('save'),current=document.getElementById('current').value,next=document.getElementById('next').value,confirm=document.getElementById('confirm').value;if(next!==confirm){msg.textContent='Новите лозинки не се совпаѓаат.';return;}b.disabled=true;msg.textContent='Се зачувува…';try{const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({currentPassword:current,newPassword:next})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Промената не успеа.');msg.textContent='Лозинката е променета успешно.';document.getElementById('change').reset();}catch(x){msg.textContent=x.message;}finally{b.disabled=false;}});
</script></body></html>
